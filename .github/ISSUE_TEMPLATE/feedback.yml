name: 反馈与建议
description: 报告数据问题、功能建议，或提出你基于本项目做的二次开发
labels: feedback
body:
  ## 类型
  - [ ] 数据问题（门店/场次/活动信息有误或过期）
  - [ ] 功能建议
  - [ ] 二次开发（我基于本项目做了 X，链接是 Y）
  - [ ] 其他

  ## 描述
  <!-- 尽量具体。如果和数据有关，请注明城市名 + 门店名 + 你看到的实际内容 -->

  ## 环境（可选）
  - 使用方式：在线地图 / 本地起服务 / 单文件 index.html / 作为 Skill
  - 浏览器或系统：

  ## 相关链接
  <!-- 如果是二次开发，这里贴你的仓库或在线地址，我们会在 README 里加链接 -->
